# ─────────────────────────────────────────────────────────────────────────────
# SpykingCircus 2 (via SpikeInterface) run_kwargs
# ─────────────────────────────────────────────────────────────────────────────
# Read by src/ns3_sort_bench/adapters/si_sorters.py::SpykingCircus2Adapter.
# Passed as **run_kwargs to spikeinterface.sorters.run_sorter().
#
# Key names verified against Spykingcircus2Sorter._default_params on SI
# main (src/spikeinterface/sorters/internal/spyking_circus2.py).  Two
# things matter:
#
#   1. Most knobs are NESTED (detection.method_kwargs.detect_threshold,
#      general.radius_um, ...).  There is no top-level `detect_threshold`
#      or `detect_radius` — SI raises "Invalid parameters" for those.
#   2. SI merges user params with a SHALLOW dict.update
#      (BaseSorter.set_params_to_folder).  Passing `detection:` REPLACES
#      the whole default `detection` sub-dict, so every sub-key must be
#      restated here, not just the one being changed.
#
# If your installed SI is older/newer, `ns3sb run --adapter spykingcircus2`
# prints the valid top-level keys in the ValueError.
# ─────────────────────────────────────────────────────────────────────────────

run_kwargs:
  # Motion correction off: SC2's dredge preset expects dense geometry;
  # on a 4-8 channel probe it fits drift from too few spikes.
  apply_motion_correction: false

  # Full restatement of the `general` block (shallow merge) — only
  # radius_um changes, 100 → 150 µm for tetrode-scale reach.
  general:
    ms_before: 0.5
    ms_after:  1.5
    radius_um: 150.0

  # Full restatement of the `detection` block — only detect_threshold
  # changes, 5 → 4.5 σ for quiet CA1 traces.
  detection:
    method: matched_filtering
    method_kwargs:
      peak_sign: neg
      detect_threshold: 4.5
    pipeline_kwargs: {}
