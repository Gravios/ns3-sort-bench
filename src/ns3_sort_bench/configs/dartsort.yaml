# ─────────────────────────────────────────────────────────────────────────────
# DARTsort (via SpikeInterface) run_kwargs
# ─────────────────────────────────────────────────────────────────────────────
# Read by src/ns3_sort_bench/adapters/dartsort.py.  SI's DartsortSorter
# has an empty _default_params and instead derives the valid keys from
# dartsort's own `DARTsortUserConfig` (pydantic); `_run_from_folder`
# does `DARTsortUserConfig(**params)`.  So the keys below are
# DARTsortUserConfig field names — verified against dartsort main
# (src/dartsort/config.py).  Field names have changed across dartsort
# releases; if your installed version rejects one, the SI ValueError
# lists the valid keys for that version.
#
# Caller sort(run_kwargs={...}) merges on top.
# ─────────────────────────────────────────────────────────────────────────────

run_kwargs:
  # Motion estimation off (upstream default True).  DREDge fits per-depth
  # displacement from the spikes themselves; a short 4-channel paired
  # recording doesn't constrain it, and a bad motion estimate shifts
  # every template — the likely reason the hc1 run returned only a
  # handful of spikes.
  do_motion_estimation: false

  # Extracellular spikes are negative-going; upstream default "both"
  # doubles detections with positive-going artifacts.
  peak_sign: neg

  # Thresholds left at upstream defaults (voltage_threshold 3.0,
  # matching_threshold 6.0, initial_threshold 9.0) until the
  # motion-off run is measured.  Lower matching_threshold (e.g. 5.0)
  # is the knob if recall is still low after that.
