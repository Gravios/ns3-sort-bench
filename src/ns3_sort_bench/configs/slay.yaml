# ─────────────────────────────────────────────────────────────────────────────
# SLAy adapter config
# ─────────────────────────────────────────────────────────────────────────────
# Read by src/ns3_sort_bench/adapters/slay.py.  SLAy is a post-merge
# layer on top of Kilosort 4; this file splits its tuning into two
# blocks that are kept distinct because they fire at different stages:
#
#   ks_kwargs:   forwarded to the wrapped kilosort4 adapter's sort()
#                call.  Shape matches configs/kilosort4.yaml's
#                run_kwargs — any tuning here OVERRIDES kilosort4.yaml
#                only for this slay invocation, and the harness's own
#                run_kwargs={...} override still wins over this file.
#
#   slay_kwargs: forwarded to slay._slay_merges, which runs the
#                neural-network merge classifier on the kilosort4
#                output.  Thresholds here govern how aggressively
#                slay reunites over-split clusters — higher threshold,
#                fewer merges.
#
# Values below are first-guess; validate against the reference
# session before shipping as the baseline.
# ─────────────────────────────────────────────────────────────────────────────

ks_kwargs: {}            # inherit configs/kilosort4.yaml wholesale

slay_kwargs:
  # Classifier score above which slay merges two kilosort4 clusters.
  # The upstream default is ~0.9 (very conservative, few merges).
  # 0.7 is more aggressive and recovers drift-split fragments that
  # kilosort4 kept separate; 0.5 is the floor below which slay starts
  # pulling in unrelated clusters.
  merge_threshold: 0.7
