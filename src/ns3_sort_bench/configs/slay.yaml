# ─────────────────────────────────────────────────────────────────────────────
# SLAy adapter config
# ─────────────────────────────────────────────────────────────────────────────
# Read by src/ns3_sort_bench/adapters/slay.py.  Two blocks:
#
#   ks_kwargs:   forwarded to the wrapped kilosort4 adapter's sort().
#                Empty = inherit configs/kilosort4.yaml.
#   slay_kwargs: forwarded to slay.merge.recommend_merges(**kwargs).
#
# slay_kwargs is deliberately EMPTY.  _slay_merges wraps the call in a
# bare `except Exception: return []`, so an unrecognised kwarg would not
# error — it would silently return zero merges and slay would equal
# kilosort4.  Add keys here only after confirming them against the
# installed slay's recommend_merges signature
# (python3 -c "import inspect, slay.merge as m; print(inspect.signature(m.recommend_merges))").
# ─────────────────────────────────────────────────────────────────────────────

ks_kwargs: {}
slay_kwargs: {}
