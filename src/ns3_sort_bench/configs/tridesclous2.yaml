# ─────────────────────────────────────────────────────────────────────────────
# Tridesclous 2 (via SpikeInterface) run_kwargs
# ─────────────────────────────────────────────────────────────────────────────
# Read by src/ns3_sort_bench/adapters/si_sorters.py::Tridesclous2Adapter.
# Passed as **run_kwargs to spikeinterface.sorters.run_sorter().
#
# Key names verified against Tridesclous2Sorter._default_params on SI
# main (src/spikeinterface/sorters/internal/tridesclous2.py) — a flat
# dict, so a single key can be overridden without restating siblings.
# Relevant upstream defaults: detect_threshold 5.0, peak_sign "neg",
# detection_radius_um 150, n_pca_features 6, apply_motion_correction False.
# ─────────────────────────────────────────────────────────────────────────────

run_kwargs:
  # 5.0 → 4.5 σ: TDC2 led IoU on hc1 but with a small matched cluster
  # (recall 0.45); a slightly lower threshold should recover more of
  # the cell's quieter spikes.  Revert if precision drops more than
  # recall gains.
  detect_threshold: 4.5
