# ─────────────────────────────────────────────────────────────────────────────
# MountainSort 5 (via SpikeInterface) run_kwargs
# ─────────────────────────────────────────────────────────────────────────────
# Read by src/ns3_sort_bench/adapters/si_sorters.py::MountainSort5Adapter.
# Passed verbatim as **run_kwargs to spikeinterface.sorters.run_sorter().
# Users can merge on top at call time via adapter.sort(run_kwargs={...}).
#
# Pre-tuning this file shipped empty; the paired-CRCNS hc1 run then
# matched only 4 of 123 GT spikes.  The defaults MS5 ships assume
# dense Neuropixels-style geometry and a single-pass scheme that
# does not generalise to tetrodes.  Below is a first-guess retune
# aimed at low-channel-count CA1 — validate against the reference
# session before shipping as the baseline.
#
# Key references (MS5 param names from the SI wrapper):
#   scheme                                 — 1 (one-shot) / 2 (drift-aware
#                                            two-pass) / 3 (long sessions)
#   detect_threshold                       — σ multiples (noise-normalised)
#   detect_channel_radius (µm)             — cross-channel pooling radius
#   snippet_T1 / snippet_T2                — samples before/after peak
#   npca_per_channel / npca_per_subdivision — feature-space depth
# ─────────────────────────────────────────────────────────────────────────────

run_kwargs:
  # Drift-aware two-pass.  Scheme 1 is a single-shot KMeans+classify
  # that under-performs on realistic data; scheme 3 is for recordings
  # long enough to need chunk-wise retraining (hours).  2 is the right
  # middle for a 10-30 min CA1 session.
  scheme: 2

  # Detection threshold in σ.  Upstream default is 5.5; 4.5 is more
  # permissive and useful on quiet CA1 traces where the smallest real
  # spikes sit close to the noise floor.  Move back up if the sort
  # inflates with false positives.
  detect_threshold: 4.5

  # Cross-channel pooling radius for detection (µm).  Default (~50)
  # was tuned for dense 20-µm-pitch probes; on a 4-channel tetrode
  # with ~100-200 µm effective reach, 150 covers the real cell's
  # footprint without over-pooling noise from distant sites.  Scale
  # with your probe's channel spacing.
  detect_channel_radius: 150

  # Snippet geometry (samples before and after the peak).  Matching
  # the pipeline's 32-sample Klusters convention (peak at 16) keeps
  # the templates aligned with every other adapter on the bench.
  snippet_T1: 16
  snippet_T2: 16

  # Feature-space depth.  npca_per_channel is the per-channel PC count
  # before the per-subdivision stage; defaults (3 / 10) are already
  # reasonable on high-SNR data.  Raise if MS5 over-merges co-located
  # cells.
  npca_per_channel: 3
  npca_per_subdivision: 10
