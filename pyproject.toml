[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ns3-sort-bench"
version = "0.1.0"
description = "Cross-sorter benchmark harness for neurosuite-3 / fiber-kit sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gravios (neurosuite-3)", email = "justingraboski@gmail.com" },
]
keywords = ["spike sorting", "neuroscience", "benchmark", "neurosuite", "fiber-kit"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Core runtime deps are RANGES, not pins.  The harness is installed next
# to fiber-kit and neurosuite-3's Python helpers (and whatever else lives
# in that environment), so it must accept the numpy / scipy / pyyaml
# already there: an exact pin makes pip replace them and breaks packages
# that need the installed ones (numba's numpy ceiling, pandas < 3 for
# hdmf / streamlit).
#   * numpy, scipy, pyyaml carry fiber-kit's own floors.  neurosuite-3's
#     helpers (ndm_localise, ndm_estimategeometry, ndm_autoklusta, the
#     Klusters self-tests) ask for the same three without a version, so
#     one set satisfies all three projects.  SpikeInterface raises the
#     numpy floor to 2.0 by itself.
#   * spikeinterface stays inside one minor series: a point release there
#     can change spike-matching semantics and with it every stored score.
#   * The exact environment the smoke tests passed against is
#     requirements.lock -- `pip install -r requirements.lock` in a fresh
#     venv when the numbers must be reproducible.  Regenerate it with
#     `uv pip compile --python-version 3.13 --extra all pyproject.toml
#     --output-file requirements.lock`.
# Checked with numpy 2.3.5 / pandas 2.3.3 / scipy 1.16.3 / numba 0.62.1
# and with numpy 2.5.3 / pandas 3.0.5 / scipy 1.18.1 / numba 0.68.1.
dependencies = [
    "numpy>=1.21",                  # = fiber-kit
    "scipy>=1.7",                   # = fiber-kit
    "pyyaml>=5.3",                  # = fiber-kit
    "pandas>=2.2",
    "spikeinterface>=0.105.4,<0.106",
    "probeinterface>=0.4.0",
    "neo>=0.14.5",
    "tqdm",
]

[project.optional-dependencies]
# Each entry is an opt-in sorter + any companion packages it needs.  The
# sorters themselves keep an exact version -- they are what is measured --
# while loaders, the accelerator and the test tools take ranges like the
# core.  Install with
# `pip install ns3-sort-bench[kilosort4,dartsort,...]`.
# ---------------------------------------------------------------------
# Pröpper 2015 BOTM reference needs no extras — ships with core.
# fiber-kit integration (reads .fetD/.spkD, uses fiber_lib transforms).
# NOT on PyPI; installed from git.  requirements.lock pins the exact SHA
# the harness smoke tests passed against; `pip install [fiber-kit]` on
# its own tracks the latest commit on main.
fiber-kit = [
    "fiber-kit @ git+https://github.com/Gravios/fiber-kit.git",
]

# SpikeInterface-wrapped sorters.  Latest-compatible as of 2026-11-02;
# bump requires re-resolving against the full [all] set and re-running CI.
mountainsort5 = ["mountainsort5 == 0.5.9"]
tridesclous2  = ["tridesclous == 1.6.9"]
spykingcircus2 = ["numba>=0.60", "hdbscan>=0.8.33"]   # built into SpikeInterface; these are what its check wants
kilosort4     = ["kilosort == 4.1.7"]

# DARTsort (Boussard, Varol, Paninski 2023+).  Needs Python >= 3.12 and
# torch >= 2.2 — upstream metadata takes care of both.
dartsort = ["dartsort == 0.5.31"]

# SLAy (Janelia 2025).  Upstream pins requires-python = "~=3.11.0", so this
# extra is INCOMPATIBLE with the rest of [all] on Python 3.12+; install
# SLAy standalone in a dedicated Python 3.11 env.  Upstream repo is the
# first author's — Saikou Koukuntla (saikoukunt), NOT the JaneliaSciComp
# path earlier scaffolding guessed (that path 404s).
slay = [
    "slay @ git+https://github.com/saikoukunt/SLAy.git",
]

# SpikeForest ground-truth corpus loader
spikeforest = ["spikeforest>=0.12.9"]

# IBL public datasets (DARTsort hybrid corpus regeneration).
ibl = ["ONE-api>=3.6.2"]

# Performance accelerator for SpikeInterface's comparison code
# A range: numba caps numpy, so an exact numba would force numpy too.
accel = ["numba>=0.60"]

# CPU-only sorter bundle — no torch, no GPU wheels (~400 MB total install).
# Includes [test] so `pytest tests/` works on a GPU-less workstation too.
all-cpu = [
    "ns3-sort-bench[fiber-kit,mountainsort5,tridesclous2,spykingcircus2,spikeforest,accel,test]",
]

# Test runner — enough to `pytest tests/` without pulling in developer
# tooling.  Included in [all] so a full install can validate itself.
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

# Dev / test — a single-command "I'm developing on this" install.
# References [all] (which already pulls [test]) + ruff on top, so one
# `pip install ns3-sort-bench[dev]` yields the full sorter stack, the
# corpora loaders, pytest, pytest-cov, and ruff.  Pick [test] (lighter)
# if you only want to run the test suite against a chosen subset of
# extras — e.g. `pip install ns3-sort-bench[fiber-kit,test]`.
dev = [
    "ns3-sort-bench[all]",
    "ruff>=0.6",
]

# EVERYTHING pip-installable in one Python env.  Excludes SLAy (needs
# its own Python 3.11 env, see the [slay] comment above).  Resolves to
# ~148 packages, ~3 GB installed with the CUDA 13 wheels torch and
# faiss pull in.  Verified cleanly on Python 3.13.18 / linux-x86_64 on
# 2026-11-02.  Includes [test] so a full install can self-check with
# `pytest tests/` out of the box.
all = [
    "ns3-sort-bench[fiber-kit,mountainsort5,tridesclous2,spykingcircus2,kilosort4,dartsort,spikeforest,ibl,accel,test]",
]

[project.scripts]
# Primary entry point — short, muscle-memory friendly, verb-noun subcommands.
ns3sb            = "ns3_sort_bench.cli:main"
# Back-compat alias; forwards to the same main().
ns3-sort-bench   = "ns3_sort_bench.cli:main"
# Dashboard renderer stays as its own standalone command.
ns3-bench-render = "ns3_sort_bench.dashboard.render:main"

[project.urls]
Homepage = "https://github.com/Gravios/ns3-sort-bench"
Issues = "https://github.com/Gravios/ns3-sort-bench/issues"
"neurosuite-3" = "https://github.com/Gravios/neurosuite-3"
"fiber-kit" = "https://github.com/Gravios/fiber-kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Per-adapter tuning yamls read via importlib.resources at import time;
# a source install resolves them on disk, a wheel install needs them in
# package-data or the files are missing after `pip install`.
"ns3_sort_bench.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"
